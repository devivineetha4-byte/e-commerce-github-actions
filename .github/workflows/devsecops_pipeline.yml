#Goal is to call the workflows in the order to implement a Shift Left

name: DevSecOps 

on:
  push:

jobs:
  
  # Secret Scan
  secret-scan:
    uses: ./.github/workflows/secrets-scanning.yml
  
  
  # Code
  code:
    needs: secret-scan
    uses: ./.github/workflows/lint-and-test.yml

  # SAST Scan 
  sast:
    needs: code
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit
     

  # Dependency Scan
  dependency-scan:
    needs: sast
    uses: ./.github/workflows/dependency_scan.yml
    


  # Build     
  build-and-scan:
    needs: dependency-scan
    uses: ./.github/workflows/trivy_scans.yml
    secrets: inherit


  # Push to Docker Hub     
  docker-push:
    needs: build-and-scan
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit

  # Deploy
  deploy:
     needs: [docker-push]
     uses: ./.github/workflows/CD.yml
     secrets: inherit 

   # Dast
  dast:
     needs: [deploy]
     uses: ./.github/workflows/dast.yml
     secrets: inherit
  
