#Goal: To scan for the code for tokesns, secrets, API Keys or any leaked passwords so that if found, we can quickly 
#rotate the exposed tokens/keys/etc
# rotate means deleting existing code and adding new code

name: Secrets Scan

on:
  workflow_call:

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
          
          
