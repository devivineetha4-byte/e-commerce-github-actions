#Goal: To scan for the code for tokesns, secrets, API Keys or any leaked passwords so that if found, we can quickly 
#rotate the exposed tokens/keys/etc
# rotate means deleting existing code and adding new code

name: Secrets Scan
on:
  workflow_call:  

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  

      - name: Scan for Leaks  
        uses: dortort/betterleaks-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            config: .github/.gitleaks.toml
          
