#Goal: To scan for the code for tokesns, secrets, API Keys or any leaked passwords so that if found, we can quickly 
#rotate the exposed tokens/keys/etc
# rotate means deleting existing code and adding new code

name: Secrets Scan

on:
  workflow_call:

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.2_linux_x64.tar.gz

      - name: Run Secret Scan
        run: |
          ./gitleaks detect --source . --verbose
        
          
          
