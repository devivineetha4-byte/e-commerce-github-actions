# Goal : To deploy the build and tested image to an EC2 instance

name: CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Setup Docker
        uses: docker/setup-docker-action@v5
      
      - name: Docker Login  
        uses: docker/login-action@v4          
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Docker container
        run: |
          docker compose up -d  
