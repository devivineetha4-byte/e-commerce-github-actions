# Goal : To deploy the build and tested image to an EC2 instance

name: CD

on:
  workflow_call:
    
    
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      

      - name: Run Docker container
        run: |
          docker compose up -d --build --force-recreate
          
