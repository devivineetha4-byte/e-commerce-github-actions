#Goal : To run the continuous integration workflow for the e-commerce project
name: CI
on:
  push:
    

jobs:
  # Code
  code:
    uses: ./.github/workflows/lint-and-test.yml

  # Build     
  build-and-push:
    needs: code
    uses: ./.github/workflows/docker.yml
    secrets: inherit

   # Deploy
  deploy:
     needs: [code,build-and-push]
     uses: ./.github/workflows/CD.yml
     secrets: inherit 
